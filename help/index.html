<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>帮助</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;user-select:none}
.title{font-size:70px;font-weight:900;margin-bottom:40px}
.btn{background:#0066ff;color:#fff;border:none;padding:16px 35px;font-size:20px;border-radius:10px;margin:10px;cursor:pointer}
</style>
</head>
<body>

<div class="title">帮助</div>
<button class="btn" onclick="help()">在线帮助</button>
<button class="btn" onclick="down()">下载</button>
<div class="footer">
        本网站服务器部署于海外，无需进行工信部ICP备案 | 
        <a href="https://beian.miit.gov.cn/" target="_blank">工信部ICP备案查询官网</a>
</div>
<script type="text/javascript">
function help(){
    document.write("<script src='https://w1022.ttkefu.com/k/?fid=5J9FDG0' charset=utf-8><\/script>");
    document.write("<div style='display:none;'><a href='https://www.ttkefu.com'>在线客服系统<\/a><\/div>");
}

function down(){
    let a=document.createElement("a")
    a.href="abc.png"
    a.download="name.png"
    document.body.appendChild(a)
    a.click()
    a.remove()
}

document.oncontextmenu=function(){return false}
document.onkeydown=function(e){
if(e.key=="F12"||(e.ctrlKey&&e.key=="u")||(e.ctrlKey&&e.shiftKey&&e.key=="i")){
return false
}
}
</script>

</body>
</html>
