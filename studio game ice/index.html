<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>冰火娃7 三人版（新朋友窄体型）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#151515;display:flex;flex-direction:column;align-items:center;padding:16px;color:#fff;font-family:Microsoft YaHei}
canvas{border:3px solid white;background:#263442}
.tip{margin-bottom:10px;line-height:1.7}
</style>
</head>
<body>
<div class="tip">
🔵冰娃(WASD) | 🔴火娃(方向键) | ⚫新朋友(G← J→)
<br>全员跳跃：Y键；<b>新朋友体型更窄，唯一能进入窄通道按下内部按钮！</b>
</div>
<canvas id="game" width="960" height="540"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const keys = {};
// ✅【修复按键赋值BUG】
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

//物理参数
const GRAVITY = 0.55;
const JUMP_FORCE = -12.5;
const MOVE_SPEED = 4;
const BIG_SIZE = 32;    //冰娃、火娃体型（宽32）
const SMALL_W = 20;     //新朋友宽度（窄！）
const SMALL_H = 32;

//三名角色数据
const players = [
    //0：冰娃 蓝色（大号体型）
    {x: 60, y: 420, vx: 0, vy: 0, color: "#44ccff", w: BIG_SIZE, h: BIG_SIZE, onGround: false},
    //1：火娃 红色（大号体型）
    {x: 110, y: 420, vx: 0, vy: 0, color: "#ff4444", w: BIG_SIZE, h: BIG_SIZE, onGround: false},
    //2：新朋友 灰色（窄体型！专门走窄路）
    {x: 160, y: 420, vx: 0, vy: 0, color: "#aaaaaa", w: SMALL_W, h: SMALL_H, onGround: false}
];

//平台 [x,y,宽,高]
const platforms = [
    [0, 470, 960, 70],
    [220, 390, 120, 16],
    [420, 320, 130, 16],
    [610, 250, 140, 16],
    [780, 180, 160, 16],
    //窄通道平台（只有小个子能通行，横向空隙宽度22）
    [330, 240, 90, 16],
    [445, 240, 90, 16]
];
//窄墙体，制造狭小入口（冰火娃进不去）
const narrowWall = [
    [310, 170, 20, 70],
    [535, 170, 20, 70]
];

//水域
const waterBlue = [[180, 454, 65, 16]]; //冰娃安全
const waterRed = [[500, 454, 65, 16]];  //火娃安全
//尖刺
const spikes = [[660, 452, 45, 18]];

//按钮（位于窄通道内部！只有新朋友可以触碰）
const buttons = [
    {x: 385, y:212, w:26, h:12, pressed:false}
];
//铁门：按钮按下开启
const door = {x:730, y:110, w:16, h:70, open:false};
//终点区域
const goal = [830,145,55,35];

//碰撞工具
function rectCollide(actor, block){
    const ax = actor.x, ay = actor.y, aw = actor.w, ah = actor.h;
    const bx = block[0], by = block[1], bw = block[2], bh = block[3];
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

//角色重生
function respawnAll(){
    players[0].x=60;players[0].y=420;players[0].vx=0;players[0].vy=0;
    players[1].x=110;players[1].y=420;players[1].vx=0;players[1].vy=0;
    players[2].x=160;players[2].y=420;players[2].vx=0;players[2].vy=0;
    buttons[0].pressed = false;
    door.open = false;
}

function updatePlayer(p, ctrlLeft, ctrlRight){
    p.vx = 0;
    if(keys[ctrlLeft]) p.vx = -MOVE_SPEED;
    if(keys[ctrlRight]) p.vx = MOVE_SPEED;

    //跳跃 Y键
    if(keys["y"] && p.onGround){
        p.vy = JUMP_FORCE;
    }
    p.vy += GRAVITY;

    //水平移动+碰撞
    p.x += p.vx;
    const allObstacle = [...platforms, ...narrowWall];
    for(let plat of allObstacle){
        if(rectCollide(p, plat)){
            if(p.vx > 0) p.x = plat[0] - p.w;
            if(p.vx < 0) p.x = plat[0] + plat[2];
        }
    }

    //垂直移动+地面判定
    p.y += p.vy;
    p.onGround = false;
    for(let plat of platforms){
        if(rectCollide(p, plat)){
            if(p.vy > 0){
                p.y = plat[1] - p.h;
                p.onGround = true;
            }else if(p.vy < 0){
                p.y = plat[1] + plat[3];
            }
            p.vy = 0;
        }
    }

    //铁门碰撞（未开启阻挡通行）
    if(!door.open && rectCollide(p,[door.x,door.y,door.w,door.h])){
        if(p.vx>0) p.x = door.x - p.w;
        if(p.vx<0) p.x = door.x + door.w;
    }

    //掉落虚空检测
    if(p.y > 560) respawnAll();
}

function checkDanger(){
    const p1 = players[0];
    const p2 = players[1];
    const p3 = players[2];
    //水域判定
    for(let w of waterBlue){
        if(rectCollide(p2,w)||rectCollide(p3,w)) respawnAll();
    }
    for(let w of waterRed){
        if(rectCollide(p1,w)||rectCollide(p3,w)) respawnAll();
    }
    //尖刺
    for(let s of spikes){
        if(rectCollide(p1,s)||rectCollide(p2,s)||rectCollide(p3,s)) respawnAll();
    }

    //按钮检测（仅小个子能够走到里面触发）
    const btn = buttons[0];
    if(rectCollide(players[2],[btn.x,btn.y,btn.w,btn.h])){
        btn.pressed = true;
        door.open = true;
    }

    //通关判定：三个人全部抵达终点
    let p1goal = rectCollide(p1, goal);
    let p2goal = rectCollide(p2, goal);
    let p3goal = rectCollide(p3, goal);
    if(p1goal && p2goal && p3goal){
        alert("🎉全部角色到达终点，通关成功！");
        respawnAll();
    }
}

function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    //绘制平台
    ctx.fillStyle="#556677";
    platforms.forEach(p=>{ctx.fillRect(p[0],p[1],p[2],p[3])})
    //窄墙体
    ctx.fillStyle="#334455";
    narrowWall.forEach(w=>ctx.fillRect(w[0],w[1],w[2],w[3]))

    //水域
    ctx.fillStyle="#33aaff";
    waterBlue.forEach(w=>ctx.fillRect(w[0],w[1],w[2],w[3]))
    ctx.fillStyle="#ff3333";
    waterRed.forEach(w=>ctx.fillRect(w[0],w[1],w[2],w[3]))

    //尖刺
    ctx.fillStyle="#dddddd";
    spikes.forEach(s=>{
        ctx.beginPath();
        ctx.moveTo(s[0],s[1]+s[3]);
        ctx.lineTo(s[0]+s[2]/2,s[1]);
        ctx.lineTo(s[0]+s[2],s[1]+s[3]);
        ctx.fill();
    })

    //按钮
    const btn = buttons[0];
    ctx.fillStyle = btn.pressed ? "#44dd44":"#dd4444";
    ctx.fillRect(btn.x,btn.y,btn.w,btn.h);

    //铁门
    ctx.fillStyle = door.open ? "#222222":"#885533";
    ctx.fillRect(door.x,door.y,door.w,door.h);

    //终点区域
    ctx.fillStyle="#ffdd22";
    ctx.fillRect(goal[0],goal[1],goal[2],goal[3]);

    //绘制三名角色
    players.forEach(p=>{
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,p.w,p.h);
        ctx.strokeStyle="#fff";
        ctx.strokeRect(p.x,p.y,p.w,p.h);
    })
}

function loop(){
    //更新各个角色控制
    updatePlayer(players[0], "a", "d"); //冰娃 A D
    updatePlayer(players[1], "arrowleft", "arrowright"); //火娃 ←→
    updatePlayer(players[2], "g", "j"); //新朋友 G J
    checkDanger();
    render();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
